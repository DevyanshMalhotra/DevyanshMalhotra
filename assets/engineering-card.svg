  </defs>
  <rect x="1" y="1" width="1198" height="248" rx="18" fill="url(#panel)" stroke="#1E293B"/>
  <rect x="38" y="38" width="6" height="174" rx="3" fill="url(#accent)"/>

  <text x="78" y="70" fill="#94A3B8" font-size="14" font-family="JetBrains Mono,Consolas,monospace">devyansh@github:~$</text>
  <text x="78" y="105" fill="#F8FAFC" font-size="24" font-family="JetBrains Mono,Consolas,monospace" font-weight="700">whoami</text>

  <g font-family="JetBrains Mono,Consolas,monospace" font-size="16">
    <text x="78" y="145" fill="#CBD5E1">role</text>
